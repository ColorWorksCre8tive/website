<!--
  Static HTML form for Netlify Forms detection.
  Netlify's build bot scans HTML files at deploy time to register forms.
  Since Next.js renders the real form client-side via React, this static
  version lives in /public so Netlify can detect it and wire up the backend.
  Users never see this page — it exists solely for the form detector.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Project Inquiry Form</title>
</head>
<body>
  <form name="project-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="project-inquiry" />
    <p>
      <label>Don't fill this out: <input name="bot-field" /></label>
    </p>
    <p>
      <label>Name <input type="text" name="name" required /></label>
    </p>
    <p>
      <label>Email <input type="email" name="email" required /></label>
    </p>
    <p>
      <label>Organization <input type="text" name="organization" /></label>
    </p>
    <p>
      <label>Message <textarea name="message" required></textarea></label>
    </p>
    <p>
      <button type="submit">Send</button>
    </p>
  </form>
</body>
</html>
